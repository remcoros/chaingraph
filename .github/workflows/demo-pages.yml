name: Deploy demo
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify selected source
        shell: bash
        env:
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EVENT_COMMIT"
          node scripts/release-check.mjs
          printf 'Demo source: main (%s)\n' "$EVENT_COMMIT" >> "$GITHUB_STEP_SUMMARY"
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - run: npm run check
      - name: Build and check demo assets
        env:
          CHAINGRAPH_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          CHAINGRAPH_SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          npm run build:demo
          npm run check:demo
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist-demo/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: freshness
        name: Check source is still current
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$current" = "$EVENT_COMMIT" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            printf 'Demo deployment skipped: main has moved from %s to %s.\n' \
              "$EVENT_COMMIT" "$current" >> "$GITHUB_STEP_SUMMARY"
          fi
      - id: deployment
        if: steps.freshness.outputs.current == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
