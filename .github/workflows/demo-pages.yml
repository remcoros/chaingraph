name: Deploy demo
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to deploy (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: demo-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - id: release
        name: Select published stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Choose a stable release tag in vX.Y.Z form.' >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,publishedAt \
            | jq -e --arg tag "$RELEASE_TAG" \
              '.tagName == $tag and .isDraft == false and .isPrerelease == false and
               (.publishedAt | type == "string" and length > 0)' >/dev/null
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Verify selected source
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          commit=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$commit"
          if [ "$EVENT_NAME" = release ]; then test "$commit" = "$EVENT_COMMIT"; fi
          node scripts/release-check.mjs --tag "$RELEASE_TAG"
          printf 'Demo source: %s (%s)\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_STEP_SUMMARY"
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - run: npm run check
      - name: Build and check demo assets
        env:
          CHAINGRAPH_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          CHAINGRAPH_SOURCE_URL: https://github.com/${{ github.repository }}
        run: |
          npm run build:demo
          npm run check:demo
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist-demo/
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
