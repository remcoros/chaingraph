name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: node scripts/release-check.mjs
      - run: npm run check
      - name: Verify runtime license notices
        run: npm run licenses && git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Test built application with production security headers
        shell: bash
        run: |
          config_dir=$(mktemp -d)
          cp .env.example "$config_dir/.env.testnet4"
          cp .env.example "$config_dir/.env.mainnet"
          CHAINGRAPH_NETWORK_CONFIG_DIR="$config_dir" SERVER_PORT=4300 SERVER_HOST=127.0.0.1 NODE_ENV=production node --use-system-ca --import tsx server/index.ts > /tmp/chaingraph-production.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; rm -rf "$config_dir"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4300/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4300/ >/dev/null
          node -e 'fetch("http://127.0.0.1:4300/api/networks").then(r=>r.json()).then(x=>{if(JSON.stringify(x.networks)!==JSON.stringify(["mainnet","testnet4"]))process.exit(1)})'
          npm run test:production
      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-failure-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
