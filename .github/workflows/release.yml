name: Release container
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      source_date_epoch: ${{ steps.source.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - id: source
        name: Verify signed source tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$(git cat-file -t "$RELEASE_TAG")" = tag
          key_home=$(mktemp -d)
          trap 'rm -rf "$key_home"' EXIT
          chmod 700 "$key_home"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "https://github.com/${GITHUB_REPOSITORY_OWNER}.gpg" \
            --output "$RUNNER_TEMP/release-owner-keys.asc"
          gpg --batch --homedir "$key_home" --import "$RUNNER_TEMP/release-owner-keys.asc"
          GNUPGHOME="$key_home" git verify-tag "$RELEASE_TAG"
          commit=$(git rev-parse "$RELEASE_TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$(git show -s --format=%ct "$commit")" >> "$GITHUB_OUTPUT"
      - name: Refuse to replace a prepared release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "A GitHub Release already exists for $RELEASE_TAG; refusing to replace it." >&2
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs --tag "$RELEASE_TAG"
      - run: npm ci
      - run: npm run check
      - name: Verify runtime license notices
        run: npm run licenses && git diff --exit-code -- THIRD_PARTY_NOTICES.md
      - name: Check the release build definition
        run: docker buildx bake --check release-platform
      - run: npx playwright install --with-deps chromium
      - name: Smoke test production container
        shell: bash
        env:
          SOURCE_DATE_EPOCH: ${{ steps.source.outputs.source_date_epoch }}
          SOURCE_URL: https://github.com/${{ github.repository }}
          VCS_REF: ${{ steps.source.outputs.commit }}
        run: |
          docker build --load \
            --build-arg CHAINGRAPH_SOURCE_URL="$SOURCE_URL" \
            --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
            --build-arg VCS_REF="$VCS_REF" \
            --tag chaingraph:release-check .
          config_dir=$(mktemp -d)
          cp .env.example "$config_dir/.env.testnet4"
          cp .env.example "$config_dir/.env.mainnet"
          # Public synthetic settings only. Match the read-only runtime group contract.
          chmod 750 "$config_dir"
          chmod 640 "$config_dir/.env.testnet4" "$config_dir/.env.mainnet"
          sudo chgrp 1000 "$config_dir" "$config_dir/.env.testnet4" "$config_dir/.env.mainnet"
          container=''
          trap 'if [ -n "$container" ]; then docker rm --force "$container" >/dev/null; fi; rm -rf "$config_dir"' EXIT
          container=$(docker run --detach --read-only --cap-drop ALL --security-opt no-new-privileges:true --mount "type=bind,src=$config_dir,dst=/run/chaingraph,readonly" --publish 127.0.0.1:4300:3000 chaingraph:release-check)
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4300/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4300/ >/dev/null
          docker exec "$container" node -e 'if (process.getuid() !== 1000) process.exit(1)'
          node -e 'fetch("http://127.0.0.1:4300/api/networks").then(r=>r.json()).then(x=>{if(JSON.stringify(x.networks)!==JSON.stringify(["mainnet","testnet4"]))process.exit(1)})'
          npm run test:production
      - name: Retain failed browser diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-browser-failure-${{ github.run_id }}
          path: artifacts/production-smoke/
          if-no-files-found: ignore
          retention-days: 7

  build-platform:
    needs: verify
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.commit }}
      - id: image
        name: Determine registry image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        name: Build and publish native manifest by digest
        uses: docker/bake-action@018cb6412ab401ebaa809aa5f85966b74628600f # v7
        with:
          source: .
          targets: release-platform
          vars: |
            IMAGE=${{ steps.image.outputs.name }}
            VERSION=${{ github.ref_name }}
            CHAINGRAPH_SOURCE_URL=https://github.com/${{ github.repository }}
            VCS_REF=${{ needs.verify.outputs.commit }}
            SOURCE_DATE_EPOCH=${{ needs.verify.outputs.source_date_epoch }}
            PUBLISH=true
      - name: Validate and retain the native manifest digest
        shell: bash
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
          DIGEST_DIR: ${{ runner.temp }}/release-digest
          EXPECTED_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          digest=$(jq -er '.["release-platform"]["containerimage.digest"]' <<< "$BUILD_METADATA")
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Bake did not return an image-manifest digest." >&2
            exit 1
          fi
          IFS=/ read -r expected_os expected_architecture <<< "$EXPECTED_PLATFORM"
          jq -e \
            --arg digest "$digest" \
            --arg os "$expected_os" \
            --arg architecture "$expected_architecture" \
            '.["release-platform"]["containerimage.descriptor"] |
              .digest == $digest and
              .mediaType == "application/vnd.oci.image.manifest.v1+json" and
              .platform.os == $os and
              .platform.architecture == $architecture and
              .platform.variant == null' \
            <<< "$BUILD_METADATA" >/dev/null
          mkdir -p "$DIGEST_DIR"
          : > "$DIGEST_DIR/${digest#sha256:}"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-digest-${{ matrix.artifact }}-${{ github.run_id }}
          path: ${{ runner.temp }}/release-digest/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [verify, build-platform]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.result.outputs.digest }}
      image: ${{ steps.image.outputs.name }}
    steps:
      - id: image
        name: Determine registry image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-digest-*-${{ github.run_id }}
          path: ${{ runner.temp }}/release-digests
          merge-multiple: true
      - id: result
        name: Assemble and publish the release index
        shell: bash
        env:
          DIGEST_DIR: ${{ runner.temp }}/release-digests
          IMAGE: ${{ steps.image.outputs.name }}
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(find "$DIGEST_DIR" -maxdepth 1 -type f -printf '%f\n' | sort)
          if [ "${#digests[@]}" -ne 2 ]; then
            echo "Expected exactly two native manifest digests." >&2
            exit 1
          fi
          sources=()
          for digest in "${digests[@]}"; do
            if [[ ! "$digest" =~ ^[a-f0-9]{64}$ ]]; then
              echo "Invalid manifest digest artifact: $digest" >&2
              exit 1
            fi
            sources+=("$IMAGE@sha256:$digest")
          done
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then tag_args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "No release tags were generated." >&2
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          index_file="$RUNNER_TEMP/release-index.json"
          docker buildx imagetools inspect "$IMAGE:$VERSION" --raw > "$index_file"
          digest="sha256:$(sha256sum "$index_file" | cut -d ' ' -f 1)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Attach supplementary GitHub OIDC provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.result.outputs.digest }}
          push-to-registry: true
      - name: Create the release mapping
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          INDEX_DIGEST: ${{ steps.result.outputs.digest }}
          OUTPUT_DIR: ${{ runner.temp }}/release-mapping
          RELEASE_COMMIT: ${{ needs.verify.outputs.commit }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          if [[ ! "$INDEX_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Invalid published index digest." >&2
            exit 1
          fi
          index_file="$RUNNER_TEMP/verified-release-index.json"
          docker buildx imagetools inspect "$IMAGE@$INDEX_DIGEST" --raw > "$index_file"
          observed="sha256:$(sha256sum "$index_file" | cut -d ' ' -f 1)"
          if [ "$observed" != "$INDEX_DIGEST" ]; then
            echo "Registry index digest mismatch: $observed" >&2
            exit 1
          fi
          jq -e '
            .mediaType == "application/vnd.oci.image.index.v1+json" and
            (.manifests | type == "array" and length == 2) and
            ([.manifests[] | "\(.platform.os)/\(.platform.architecture)"] | sort == ["linux/amd64", "linux/arm64"]) and
            all(.manifests[];
              .mediaType == "application/vnd.oci.image.manifest.v1+json" and
              (.digest | test("^sha256:[a-f0-9]{64}$")) and
              .platform.variant == null)' \
            "$index_file" >/dev/null
          amd64_digest=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "$index_file")
          arm64_digest=$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "arm64") | .digest' "$index_file")
          jq -n \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" \
            --arg image "$IMAGE" \
            --arg index "$INDEX_DIGEST" \
            --arg amd64 "$amd64_digest" \
            --arg arm64 "$arm64_digest" \
            '{
              schemaVersion: 1,
              source: { tag: $tag, commit: $commit },
              image: {
                name: $image,
                indexDigest: $index,
                platforms: {
                  "linux/amd64": $amd64,
                  "linux/arm64": $arm64
                }
              }
            }' > "$OUTPUT_DIR/chaingraph-$RELEASE_TAG.release.json"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-mapping-${{ github.run_id }}
          path: ${{ runner.temp }}/release-mapping/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-mapping-${{ github.run_id }}
          path: ${{ runner.temp }}/release-mapping
      - name: Create draft release for local signing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.publish.outputs.image }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapping="$RUNNER_TEMP/release-mapping/chaingraph-$RELEASE_TAG.release.json"
          test -f "$mapping"
          version=${RELEASE_TAG#v}
          notes="$RUNNER_TEMP/changelog-notes.md"
          awk -v heading="## [$version]" '
            index($0, heading) == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > "$notes"
          {
            cat "$notes"
            printf '\nContainer: `%s:%s`\n\n' "$IMAGE" "$version"
            printf 'Immutable image: `%s@%s`\n\n' "$IMAGE" "$IMAGE_DIGEST"
            printf 'Platforms: linux/amd64 and linux/arm64. Verify `%s` with its detached `%s.asc` OpenPGP signature before trusting the image digest. GitHub OIDC provenance is supplementary.\n' "$(basename "$mapping")" "$(basename "$mapping")"
          } > "$RUNNER_TEMP/chaingraph-release-notes.md"
          options=(--draft)
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "$mapping" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Chaingraph $RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/chaingraph-release-notes.md" \
            "${options[@]}"
