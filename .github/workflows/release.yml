name: Release container
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs --tag "$RELEASE_TAG"
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Smoke test production container
        shell: bash
        run: |
          docker build --load --tag chaingraph:release-check .
          container=$(docker run --detach --read-only --cap-drop ALL --security-opt no-new-privileges:true --publish 127.0.0.1:4300:3000 chaingraph:release-check)
          trap 'docker rm --force "$container" >/dev/null' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4300/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4300/ >/dev/null
          docker exec "$container" node -e 'if (process.getuid() !== 1000) process.exit(1)'
          npm run test:production

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Determine registry image
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.licenses=MIT
      - name: Build and publish verified release
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          build-args: |
            CHAINGRAPH_SOURCE_URL=https://github.com/${{ github.repository }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Create GitHub Release if absent
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists; preserving its notes.'
            exit 0
          fi
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          const tag = process.env.RELEASE_TAG;
          const version = tag.slice(1);
          const changelog = await readFile('CHANGELOG.md', 'utf8');
          const heading = `## [${version}]`;
          const start = changelog.indexOf(heading);
          if (start < 0) throw new Error('Release changelog entry is missing.');
          const bodyStart = changelog.indexOf('\n', start);
          const end = changelog.indexOf('\n## [', bodyStart);
          const notes = changelog.slice(bodyStart, end < 0 ? undefined : end).trim();
          const image = `ghcr.io/${process.env.REPOSITORY.toLowerCase()}`;
          const reference = `${image}@${process.env.IMAGE_DIGEST}`;
          await writeFile(`${process.env.RUNNER_TEMP}/chaingraph-release-notes.md`, `${notes}\n\nContainer: \`${image}:${version}\`\n\nImmutable image: \`${reference}\`\n\nPlatforms: linux/amd64 and linux/arm64. Registry artifacts include build provenance and an SBOM.\n`);
          NODE
          options=()
          if [[ "$RELEASE_TAG" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" --repo "$REPOSITORY" --verify-tag --title "Chaingraph $RELEASE_TAG" --notes-file "$RUNNER_TEMP/chaingraph-release-notes.md" "${options[@]}"
