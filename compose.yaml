name: chaingraph
services:
  chaingraph:
    image: ${CHAINGRAPH_IMAGE:-chaingraph:local}
    build:
      context: .
      args:
        CHAINGRAPH_SOURCE_URL: ${CHAINGRAPH_SOURCE_URL:-}
        VCS_REF: ${CHAINGRAPH_REVISION:-}
    environment:
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: '3000'
      CHAINGRAPH_NETWORK_CONFIG_DIR: /run/chaingraph
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-}
      SERVER_HANDLER_TIMEOUT_MS: ${SERVER_HANDLER_TIMEOUT_MS:-120000}
      MAX_RESPONSE_BYTES: ${MAX_RESPONSE_BYTES:-5242880}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-0}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
    volumes:
      - type: bind
        source: ${CHAINGRAPH_CONFIG_DIR:-./config}
        target: /run/chaingraph
        read_only: true
        bind:
          create_host_path: false
    ports:
      - '${CHAINGRAPH_BIND:-127.0.0.1}:${CHAINGRAPH_PORT:-3000}:3000'
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
